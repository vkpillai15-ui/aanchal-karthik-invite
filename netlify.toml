[build]
  publish = "site"
  functions = "netlify/functions"

[[headers]]
  for = "/v/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/a/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/p/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
